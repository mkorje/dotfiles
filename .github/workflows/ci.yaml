name: Continuous integration
on:
  pull_request:
  merge_group:
  push:
    branches:
      - main
jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: NixOS/nix-installer-action@v1
        with:
          extra-conf: |
            experimental-features = nix-command flakes
            substituters = https://cache.soopy.moe https://cache.flox.dev https://cache.nixos-cuda.org https://catppuccin.cachix.org https://mkorje.cachix.org https://nix-community.cachix.org https://cache.nixos.org/
            trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= cache.soopy.moe-1:0RZVsQeR+GOh0VQI9rvnHz55nVXkFardDqfm4+afjPo= flox-cache-public-1:7F4OyH7ZCnFhcze3fJdfyXYLQw/aV7GEed86nQ7IsOs= cache.nixos-cuda.org:74DUi4Ye579gUqzH4ziL9IyiJBlDpMRn9MBN8oNan9M= catppuccin.cachix.org-1:noG/4HkbhJb+lUAdKrph6LaozJvAeEEZj4N732IysmU= mkorje.cachix.org-1:iM64JN6YIX1myYc5JhqjVxgSjNl/zYDHYR+u++ublwM= nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs=
      - run: nix run github:Mic92/nix-fast-build -- --skip-cached --cachix-cache mkorje
        env:
          CACHIX_SIGNING_KEY: ${{ secrets.CACHIX_SIGNING_KEY }}
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
  nixos-configurations:
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        system: [aizsaule, auseklis, meness, laima]
    name: "${{ matrix.system }}: NixOS configuration"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: wimpysworld/nothing-but-nix@v10
      - uses: NixOS/nix-installer-action@v1
        with:
          extra-conf: |
            build-dir = /nix/build
            experimental-features = nix-command flakes
            substituters = https://cache.soopy.moe https://cache.flox.dev https://cache.nixos-cuda.org https://catppuccin.cachix.org https://mkorje.cachix.org https://nix-community.cachix.org https://cache.nixos.org/
            trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= cache.soopy.moe-1:0RZVsQeR+GOh0VQI9rvnHz55nVXkFardDqfm4+afjPo= flox-cache-public-1:7F4OyH7ZCnFhcze3fJdfyXYLQw/aV7GEed86nQ7IsOs= cache.nixos-cuda.org:74DUi4Ye579gUqzH4ziL9IyiJBlDpMRn9MBN8oNan9M= catppuccin.cachix.org-1:noG/4HkbhJb+lUAdKrph6LaozJvAeEEZj4N732IysmU= mkorje.cachix.org-1:iM64JN6YIX1myYc5JhqjVxgSjNl/zYDHYR+u++ublwM= nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs=
      - run: nix run github:Mic92/nix-fast-build -- --skip-cached --flake .#nixosConfigurations.${{ matrix.system }}.config.system.build.toplevel --cachix-cache mkorje
        env:
          CACHIX_SIGNING_KEY: ${{ secrets.CACHIX_SIGNING_KEY }}
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
